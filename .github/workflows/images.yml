name: images

# Publishes the container images. Nothing deploys from here, syncing the
# cluster is done by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    # Never publish from a fork or someone else's copy of the repo.
    if: github.repository_owner == 'WentTheFox'
    strategy:
      fail-fast: false
      matrix:
        part: [frontend, backend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the registry
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One tag per architecture, merged into a single multi-arch tag below.
      - name: Build and push
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha7="${GITHUB_SHA::7}"
          image="$REGISTRY/$repo-${{ matrix.part }}"
          docker build \
            --target "${{ matrix.part }}" \
            --build-arg "COMMIT_SHA=${GITHUB_SHA::12}" \
            --build-arg "COMMIT_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" \
            --tag "$image:$sha7-${{ matrix.arch }}" \
            .
          docker push "$image:$sha7-${{ matrix.arch }}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [frontend, backend]
    steps:
      - name: Log in to the registry
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `sha-<sha7>` goes last so it only exists once both architectures do.
      - name: Merge into one multi-arch tag
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          sha7="${GITHUB_SHA::7}"
          image="$REGISTRY/$repo-${{ matrix.part }}"
          docker buildx imagetools create \
            --tag "$image:$sha7" \
            "$image:$sha7-amd64" "$image:$sha7-arm64"
          docker buildx imagetools create \
            --tag "$image:sha-$sha7" \
            "$image:$sha7"
